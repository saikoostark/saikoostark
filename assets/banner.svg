<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16161e" />
      <stop offset="0.55" stop-color="#1a1b26" />
      <stop offset="1" stop-color="#24283b" />
    </linearGradient>

    <linearGradient id="accent" x1="64" y1="96" x2="1216" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7aa2f7" />
      <stop offset="0.5" stop-color="#7dcfff" />
      <stop offset="1" stop-color="#bb9af7" />
    </linearGradient>

    <linearGradient id="nameGradient" x1="92" y1="120" x2="520" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c0caf5" />
      <stop offset="1" stop-color="#7dcfff" />
    </linearGradient>

    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.28" />
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dcfff" stop-opacity="0.2" />
      <stop offset="1" stop-color="#7dcfff" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7aa2f7" stroke-opacity="0.07" stroke-width="1" />
    </pattern>

    <clipPath id="cardClip">
      <rect width="1280" height="320" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1280" height="320" fill="url(#bg)" />
    <rect width="1280" height="320" fill="url(#grid)" />
    <circle cx="1120" cy="30" r="280" fill="url(#glowPurple)" />
    <circle cx="100" cy="330" r="260" fill="url(#glowCyan)" />
  </g>

  <rect x="0.75" y="0.75" width="1278.5" height="318.5" rx="19.25" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="1.5" />
  <path d="M 28 1.5 H 1252" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <rect x="64" y="104" width="4" height="166" rx="2" fill="url(#accent)" />

  <text x="92" y="150" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="url(#nameGradient)" letter-spacing="1.5">SAIKOO STARK</text>
  <text x="94" y="190" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#7aa2f7" letter-spacing="6">FULL-STACK DEVELOPER</text>
  <text x="94" y="234" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="15" fill="#9aa5ce">TypeScript · C# · Java · Python · C/C++</text>
  <text x="94" y="264" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#565f89">github.com/saikoostark</text>

  <rect x="760" y="72" width="456" height="176" rx="14" fill="#16161e" fill-opacity="0.92" stroke="#7aa2f7" stroke-opacity="0.28" />
  <path d="M 760 86 C 760 78.268 766.268 72 774 72 H 1202 C 1209.732 72 1216 78.268 1216 86 V 104 H 760 Z" fill="#1f2335" fill-opacity="0.95" />
  <path d="M 760 104 H 1216" stroke="#7aa2f7" stroke-opacity="0.15" />

  <circle cx="784" cy="88" r="5" fill="#f7768e" />
  <circle cx="802" cy="88" r="5" fill="#e0af68" />
  <circle cx="820" cy="88" r="5" fill="#9ece6a" />
  <text x="848" y="93" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="11" fill="#565f89">saikoo@github: ~</text>

  <text x="784" y="136" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="14" fill="#9ece6a">$ <tspan fill="#c0caf5">whoami</tspan></text>
  <text x="784" y="160" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="14" fill="#7aa2f7">full-stack developer</text>
  <text x="784" y="194" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="14" fill="#9ece6a">$ <tspan fill="#c0caf5">stack --core</tspan></text>
  <text x="784" y="218" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="14" fill="#bb9af7">TypeScript · C# · Java · Python</text>
  <text x="784" y="238" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="14" fill="#9ece6a">$</text>
  <rect x="800" y="226" width="8" height="14" rx="1" fill="#7aa2f7" />
</svg>
